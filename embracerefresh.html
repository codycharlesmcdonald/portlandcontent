/* the two tabs in the title, as on the Vivian Lee page */

/* tab 2: the itemized scope, the retired page's styles scoped here */

}

<body>
<div id="proposal"><noscript><p style="padding:24px">This proposal needs JavaScript. Write to cody@macfilmproductions.com and I’ll send it another way.</p></noscript></div>

<template id="scope-tpl">
<article class="view" id="v-scope" role="tabpanel" aria-labelledby="tab-scope" hidden>
<div class="top">
  <div class="wrap">
    <span class="brand">Boudoir Bible<small>Your own mix</small></span>
    <button type="button" class="phototog" id="phototog" aria-pressed="true">Photos</button>
    <a class="htotal" id="htotal" href="#s-cost" aria-live="polite"><span>Your total</span><b class="tab" id="tb-sum"></b></a>
  </div>
</div>

<section class="hero">
  <div class="wrap">
    <p class="pick-k">Pick a starting point</p>
    <div class="pick-plan" role="group" aria-label="Starting point">
      <button type="button" data-start="A" aria-pressed="true">Boudoir Bible, <i>re-edited</i></button>
      <button type="button" data-start="B" aria-pressed="false">Boudoir Bible, <i>reproduced</i></button>
    </div>
    <p class="mixline"></p>
    <p class="lede" data-plan="A">We recut the course you already have as Boudoir Bible, give it a new look, and have it ready to relaunch before the holidays.</p>
    <p class="lede" data-plan="B">We film the whole course again in your studio in December, add a new module on light, and have it ready to launch in February.</p>
    <p class="intro">Every piece is priced on its own here, in case something in between fits you better. Pick a starting point, switch pieces on or off, and the dates and the cost update as you go.</p>
  </div>
</section>

<div class="wrap" id="main">
  <div id="content">
  <section class="sec" id="s-pieces">
    <h2>What we'll make</h2>
    <p class="sub">Every piece shows its share of the plan you've picked, setup included, and what it would cost on its own.</p>
    <aside class="rail" id="rail" aria-live="polite"></aside>
    <div>
      <p class="group">The course</p>
      <ul class="pieces">
        <li class="piece" data-id="relessons">
          <label class="tick"><input type="checkbox" id="p-relessons" aria-label="Your lessons, re-edited"><span class="box"></span></label>
          <div><h3>Your lessons, re-edited</h3>
          <p class="d">We recut all 17 lessons from your original footage. Each one gets a tighter edit around your key adjustments, color, cleaned-up sound, licensed music, captions, the new title look, and your finished images brought up full frame beside the moment that made them.</p>
          <p class="note"></p></div>

  if(has(s,'core')||has(s,'light')) out.push('Lock the lesson outlines with us by Dec 4. Each one is a short beat outline in your own words, so you teach the way you talk to a client.');
  if(has(s,'core')||has(s,'light')) out.push('Book the model and hair and makeup by Dec 8, with releases signed. The same model works every shoot day.');
  if(shoot.length) out.push('Teach on camera in your studio on the shoot days, with a closed set and a robe ready between sets.');
  if(has(s,'overview')) out.push('Sit down with us for the overview film, and bring out any products you\'d like to show.');
  if(has(s,'deck')) out.push('Send us your pose list and the images for each pose.');
  if(s.length) out.push('Give us two rounds of notes on every cut. You\'re the only approver.');
  document.getElementById('part').innerHTML=out.map(function(t){ return '<li>'+t+'</li>'; }).join('') || '<li>Pick a piece above to see your part.</li>';
}

/* dates: the filming track is the retired page's; the re-edit track moved to a yes by Dec 11 and finals for Podia on Dec 22 (lead gen, Nov 26) */
function yesDate(s){ var shoot=SHOOT.some(function(p){ return has(s,p); }), footage=has(s,'relessons') || (has(s,'promos') && !shoot); return (shoot || !footage) ? '2026-12-01' : '2026-12-11'; }
function events(){
  var s=state.sel, ev=[], shoot=SHOOT.filter(function(p){ return has(s,p); });
  var lessonsShoot=has(s,'core')||has(s,'light');
  var footage=has(s,'relessons') || (has(s,'promos') && !shoot.length);
  function add(d,t,who,kind,sh){ ev.push({d:d,t:t,who:who,kind:kind||'',sh:sh||t}); }
  if(!s.length) return ev;
  add(yesDate(s),'Your yes and the deposit','you','','Your yes');
  if(footage){
    add('2026-12-11','Your finished images for each pose, and any separate recorder audio','you','','Images and audio');
    var what=has(s,'relessons') ? 'every re-edited lesson' : 'the trailer and promos';
    add('2026-12-15','Rough cuts of '+what,'us','','Rough cuts'); add('2026-12-16','Your first notes','you','','Your notes');
    add('2026-12-18','Second cut','us'); add('2026-12-19','Your second notes','you','','Your notes');
    add('2026-12-22', has(s,'relessons') ? (has(s,'promos')&&!shoot.length ? 'Final lessons, trailer, and promos for Podia' : 'Final lessons for Podia') : 'Final trailer and promos','us','','Finals');
    if(has(s,'relessons')) add('2026-12-23','Relaunch whenever you\'re ready','you','','Relaunch');
  }
  if(has(s,'deck')) add('2026-12-04','Your pose list and images to us for the Posing Deck','you','','Pose list');
  if(lessonsShoot) add('2026-12-04','Lesson outlines locked together','you','','Outlines locked');
  if(lessonsShoot) add('2026-12-08','Model and hair and makeup booked, releases signed','you','','Model booked');
  var d1=[]; if(has(s,'core')) d1.push('the welcome and the Booty and Midsection lessons'); if(has(s,'light')) d1.push(has(s,'core') ? 'The Light' : 'The Light (half day)');
  if(d1.length) add('2026-12-15','Shoot day: a camera check, then '+d1.join(', with '),'us','shoot');
  var d2=[]; if(has(s,'core')) d2.push('the Arms and Senses lessons'); if(has(s,'overview')) d2.push('your sit-down for the overview film');
  if(d2.length){
    var half=!has(s,'core') ? ' (half day)' : '';
    var last=d2.pop(); add('2026-12-16','Shoot day: '+(d2.length ? d2.join(', ')+', and '+last : last)+half,'us','shoot');
  }
  if(lessonsShoot){
    add('2027-01-06','Rough cuts of every new lesson','us','','Rough cuts'); add('2027-01-13','Your first notes','you','','Your notes');
    add('2027-01-20','Second cut','us'); add('2027-01-23','Your second notes','you','','Your notes');
    var fin=['final lessons']; if(has(s,'overview')) fin.push('the overview film'); if(has(s,'promos')) fin.push('the trailer and promos'); if(has(s,'deck')) fin.push('the refreshed Posing Deck');
    var lf=fin.pop(); add('2027-01-29','Delivery of the '+(fin.length ? fin.join(', ')+(fin.length>1?',':'')+' and '+lf : lf),'us','','Final delivery');
  } else if(has(s,'deck')){ add('2026-12-18','Your refreshed Posing Deck','us','','Posing Deck'); }
  if(!lessonsShoot && has(s,'overview')){
    add('2026-12-22','First cut of the overview film','us','','First cut'); add('2027-01-05','Your notes','you'); add('2027-01-08','Final overview film','us','','Final film');
  }
  ev.sort(function(a,b){ return a.d<b.d ? -1 : a.d>b.d ? 1 : 0; });
  return ev;
}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pd(s){ var a=s.split('-'); return {y:+a[0], m:+a[1]-1, d:+a[2]}; }
function dkey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function andList(a){ a=a.slice(); var l=a.pop(); return a.length ? a.join(', ')+(a.length>1?',':'')+' and '+l : (l||''); }

function payPlan(s,P){
  var shoot=SHOOT.filter(function(p){ return has(s,p); }), lessonsShoot=has(s,'core')||has(s,'light');
  var footage=has(s,'relessons') || (has(s,'promos') && !shoot.length);
  var fin=lessonsShoot ? '2027-01-29' : has(s,'overview') ? '2027-01-08' : footage ? '2026-12-22' : '2026-12-18';
  var out=[], first=r2(P.pre+P.travel);
  if(first) out.push({d:yesDate(s), a:first, w:'when you sign'});
  if(P.prod) out.push({d:'2026-12-08', a:P.prod, w:'before the shoot'});
  if(P.post) out.push({d:fin, a:P.post, w:'when you approve the finals'});
  return out;
}
function byMonth(pays){
  var out=[], idx={};
  pays.forEach(function(p){ var q=pd(p.d), k=q.y+'-'+q.m; if(!(k in idx)){ idx[k]=out.length; out.push({y:q.y, m:q.m, a:0, items:[]}); } var e=out[idx[k]]; e.a=r2(e.a+p.a); e.items.push(p); });
  return out;
}
function renderTimeline(){
  var ev=events(), box=document.getElementById('tl-wall');
  if(!ev.length){ box.innerHTML='<p class="sub">Pick a piece above to see its dates.</p>'; return; }
  var pays=payPlan(state.sel, price(state.sel)), due={}, day={}, mk={}, ms=[];
  byMonth(pays).forEach(function(x){ due[x.y+'-'+x.m]=x.a; });
  var nShoot=ev.filter(function(e){ return e.kind==='shoot'; }).length, iShoot=0;
  ev.forEach(function(e){ var c=day[e.d]||(day[e.d]={ev:[],pay:[],shoot:false}); c.ev.push(e); if(e.kind==='shoot'){ c.shoot=true; e.sh='Shoot day'+(nShoot>1?' '+(++iShoot):''); } });
  pays.forEach(function(p){ (day[p.d]||(day[p.d]={ev:[],pay:[],shoot:false})).pay.push(p); });
  ev.map(function(e){ return e.d; }).concat(pays.map(function(p){ return p.d; })).forEach(function(d){ var p=pd(d), k=p.y+'-'+p.m; if(!mk[k]){ mk[k]=1; ms.push(p); } });
  ms.sort(function(a,b){ return a.y-b.y || a.m-b.m; });
  var w='';
  ms.forEach(function(p){
    var k=p.y+'-'+p.m, first=new Date(Date.UTC(p.y,p.m,1)).getUTCDay(), n=new Date(Date.UTC(p.y,p.m+1,0)).getUTCDate();
    w+='<div class="wm"><div class="wm-top"><h3>'+MONL[p.m]+' <i>'+p.y+'</i></h3>'+(due[k] ? '<span class="due">Due this month<b class="tab">'+money(due[k])+'</b></span>' : '')+'</div><div class="wg">';
    w+=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(x){ return '<span class="wh">'+x+'</span>'; }).join('');
    for(var i=0;i<first;i++) w+='<span class="wc"></span>';
    for(var d=1; d<=n; d++){
      var c=day[dkey(p.y,p.m,d)], cls='wc', inner='<span class="wn">'+d+'</span>', tip=[];
      if(c){
        cls+=' has'+(c.shoot?' shoot':'');
        c.ev.forEach(function(e){ tip.push(e.t); inner+='<span class="ev '+(e.kind==='shoot'?'sh':e.who)+'">'+e.sh+'</span>'; });
        c.pay.forEach(function(q){ tip.push(money(q.a)+' due '+q.w); inner+='<span class="ev pay tab">'+money(q.a)+' due</span>'; });
      }
      w+='<span class="'+cls+'"'+(tip.length?' title="'+tip.join('. ').replace(/"/g,'&quot;')+'"':'')+'>'+inner+'</span>';
    }
    var tail=(first+n)%7; if(tail) for(var j=tail;j<7;j++) w+='<span class="wc"></span>';
    w+='</div>';
    var mev=ev.filter(function(e){ var q=pd(e.d); return q.y===p.y && q.m===p.m; });
    if(mev.length) w+='<ul class="agenda">'+mev.map(function(e){ var q=pd(e.d); return '<li><b>'+MON[q.m]+' '+q.d+'</b><span>'+e.t+'</span></li>'; }).join('')+'</ul>';
    w+='</div>';
  });
  w+='<div class="wkey"><span><i class="f"></i>Your part</span><span><i></i>Ours</span><span><i class="sq"></i>Shoot days</span></div>';
  box.innerHTML=w;
}

function renderCost(P){
  var s=state.sel.slice();
  var names=s.map(function(x){ return NAMES[x]; });
  var last=names.pop();
  document.getElementById('cost-what').textContent = last ? 'For '+(names.length ? names.join(', ')+(names.length>1?',':'')+' and '+last : last)+'.' : 'Pick a piece above to see a total.';
  document.getElementById('cost-sum').textContent = money(P.total);
  var tb=document.getElementById('tb-sum'), ht=document.getElementById('htotal'), nt=money(P.total);
  if(tb.textContent && tb.textContent!==nt){ ht.classList.add('bump'); setTimeout(function(){ ht.classList.remove('bump'); }, 350); }
  tb.textContent = nt;
  document.getElementById('cost-pays').innerHTML=byMonth(payPlan(s,P)).map(function(m){
    return '<li><b>'+money(m.a)+'</b>in '+MONL[m.m]+'<small>'+andList(m.items.map(function(i){ var q=pd(i.d); var w=i.w.charAt(0).toUpperCase()+i.w.slice(1); return (m.items[0]===i ? w : i.w)+' on '+MON[q.m]+' '+q.d; }))+'</small></li>'; }).join('');
  var row=document.getElementById('lockrow'), lock=document.getElementById('lock');
  row.hidden=!s.length;
  var body='Hi Cody,\n\nI\'d like to lock in this quote for Boudoir Bible:\n\n'+s.map(function(x){ var n=NAMES[x]; return '- '+n.charAt(0).toUpperCase()+n.slice(1); }).join('\n')+'\n\nTotal: '+money(P.total)+'\n\nThanks!';
  lock.href='mailto:cody@macfilmproductions.com?subject='+encodeURIComponent('Boudoir Bible | Locking in my quote')+'&body='+encodeURIComponent(body);
}

function renderQs(){
  var s=state.sel, q=[];
  if(has(s,'relessons')) q.push('Would you like to be on camera in the welcome? A short to-camera piece in your studio is the one bit of filming the re-edit could add.');
  if(has(s,'core')||has(s,'relessons')||has(s,'light')||has(s,'overview')) q.push('Do you offer any products we should work into the course'+(has(s,'overview')?' or the overview film':'')+'?');
  document.getElementById('qs').innerHTML=q.map(function(t){ return '<li><span>'+t+'</span></li>'; }).join('');
  document.getElementById('s-qs').hidden=!q.length;
}

function renderRail(P){
  var r=document.getElementById('rail');
  var nt=money(P.total), n=state.sel.length, prev=r.getAttribute('data-total');
  var months=byMonth(payPlan(state.sel,P)).map(function(m){ return '<li><span>Due in '+MONL[m.m]+'</span><b class="tab">'+money(m.a)+'</b></li>'; }).join('');
  var lock=document.getElementById('lock');
  r.innerHTML='<span class="rk">Your total</span><b class="rs tab">'+nt+'</b><p class="rn">'+(n ? n+' piece'+(n>1?'s':'')+' picked, license included' : 'Pick a piece to see a total')+'</p>'+(months?'<ul>'+months+'</ul>':'')+(n ? '<a class="btn lock-btn" href="'+lock.getAttribute('href').replace(/"/g,'&quot;')+'">Let\'s lock in this quote</a>' : '')+'<a class="rl" href="#s-cost">See the full breakdown</a>';
  if(prev && prev!==nt){ r.classList.add('bump'); setTimeout(function(){ r.classList.remove('bump'); }, 350); }
  r.setAttribute('data-total', nt);
}

if('IntersectionObserver' in window) new IntersectionObserver(function(es){ es.forEach(function(e){ SC.classList.toggle('rail-gone', !e.isIntersecting); }); }, {rootMargin:'-80px 0px -40% 0px'}).observe(document.getElementById('s-pieces'));

function toggle(id){
  var s=state.sel.slice();
  if(has(s,id)) s=without(s,id); else s.push(id);
  var r=has(s,'relessons'), c=has(s,'core');
  if(r&&c) state.start='AB'; else if(r) state.start='A'; else if(c) state.start='B';
  state.sel=s; render();
}
SC.addEventListener('click', function(e){
  var b;
  if((b=e.target.closest('.pick-plan button'))){ state.start=b.getAttribute('data-start'); state.sel=PRESET[state.start].slice(); return render(); }
  if(e.target.closest('[data-reset]')){ state.sel=PRESET[state.start].slice(); return render(); }
  var li=e.target.closest('.piece');
  if(li && !e.target.closest('a')){ if(e.target.matches('input')) return; e.preventDefault(); toggle(li.getAttribute('data-id')); }
});
SC.addEventListener('change', function(e){
  var li=e.target.closest('.piece'); if(li && e.target.matches('input')) toggle(li.getAttribute('data-id'));
});
function setPhotos(on){
  SC.classList.toggle('photos', on);
  document.getElementById('phototog').setAttribute('aria-pressed', on ? 'true' : 'false');
  try{ localStorage.setItem('embrace-ph', on ? '1' : '0'); }catch(e){}
}
document.getElementById('phototog').addEventListener('click', function(){ setPhotos(!SC.classList.contains('photos')); });
var ph=true; try{ ph=localStorage.getItem('embrace-ph')!=='0'; }catch(e){}
setPhotos(ph);
render();
})();
